
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Soul in Frames | Photo Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="hero">
    <!--<p class="eyebrow">A COLLECTION OF BEAUTIFUL MOMENTS</p> -->
    <h1>Soul in Frames</h1>

    <p class="intro">
      "Every picture holds a feeling, every moment tells a story,
      and every view leaves a little magic in your heart."
    </p>
  </header>

  <!-- Category filters -->
  <div class="toolbar">
    <nav class="filters" id="filters" aria-label="Filter photos">
    </nav>

    <p class="count" id="count" aria-live="polite"></p>
  </div>

  <!-- Photo gallery -->
  <main>
    <section class="gallery" id="gallery" aria-label="Photo gallery">
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <h2>Every frame has a feeling.</h2>
    <p>Collect moments, not just photographs.</p>
    <p class="copyright">
      &copy; 2026 Soul in Frames | Made with love
    </p>
  </footer>

  <!-- Full-screen photo viewer -->
  <div class="lightbox"
       id="lightbox"
       role="dialog"
       aria-modal="true"
       aria-label="Photo viewer"
       aria-hidden="true">

    <button class="lb-btn lb-close" id="lbClose"
            aria-label="Close viewer">&times;</button>

    <button class="lb-btn lb-prev" id="lbPrev"
            aria-label="Previous photo">&#10094;</button>

    <figure class="lb-figure">
      <img id="lbImg" alt="">

      <figcaption>
        <span id="lbCaption"></span>
        <span id="lbCount" class="lb-count"></span>
      </figcaption>
    </figure>

    <button class="lb-btn lb-next" id="lbNext"
            aria-label="Next photo">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
